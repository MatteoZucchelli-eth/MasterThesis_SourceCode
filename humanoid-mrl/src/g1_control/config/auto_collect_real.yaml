# AUTO_COLLECT on the real robot: scripted right-arm approach onto a physical
# wall target, sequenced by hand.
#
# Full replacement (not an overlay) for the sim's config/auto_collect.yaml;
# select with `auto_collect_config:=auto_collect_real.yaml`. Keep both in sync:
# a missing key falls back to the handler default.
#
# Differences from the sim:
#   * No /clock: use_sim_time stays false (set by control_launch.py).
#   * No /sim/reset: no loop mode; phases are published by hand:
#         going_to_default -> trajectory_generation -> approaching
#   * One physical target (`red_square_target`, from the mocap bridge), so task
#     randomisation is off.
/**:
  ros__parameters:
    auto_collect_phase_topic: "auto_collect/phase" # String topic carrying the phase name (trajectory_generation | approaching | going_to_default | holding)
    auto_collect_standoff_m: 0.075 # Where the transit curve merges onto the wall normal; length of the straight-in push
    # Same as sim; shorter would exceed upper_body_max_joint_speed (0.25 rad/s).
    auto_collect_transit_duration_s: 15.0 # Seconds for the default-pose -> standoff leg
    auto_collect_insert_duration_s: 12.0 # Seconds for the standoff -> target straight-in push
    # Standoff settle gate: hold at the standoff until the lateral miss is nulled,
    # then push in (a miss persists through the straight insertion). 0 disables.
    auto_collect_standoff_settle_mm: 1.0 # Max lateral tip miss before the push starts [mm]
    auto_collect_standoff_settle_hold_s: 0.5 # Seconds it must stay inside that band
    auto_collect_standoff_settle_timeout_s: 10.0 # Give up waiting and push anyway (logs a warning)
    # Longer than the sim's 4.0: the measured arm lags more under the real drill.
    # Raise this (not the tolerance) if the arrival gate below keeps failing.
    auto_collect_return_duration_s: 6.0 # Seconds to interpolate the upper body back to its start pose
    # Arrival gate: every upper-body joint within the band for `_hold_s` before
    # planning (1.0 deg ~ 12 mm at the tip).
    auto_collect_return_settle_deg: 1.0 # Max per-joint error to count as back at the start pose [deg]
    auto_collect_return_settle_hold_s: 0.3 # Seconds every joint must stay inside that band
    auto_collect_return_settle_timeout_s: 10.0 # Give up waiting this long after the ramp and start anyway (logs an error)
    # Valid only if the QTM target body's x-axis is the wall normal into the wall.
    # Check "drill axis N deg off the wall normal" at trajectory_generation; set
    # false (hold start-pose FK orientation) if the body axes are wrong.
    auto_collect_align_drill: true # Steer the drill axis onto the target's wall normal
    # Level the roll against the target TF's z-axis (wall up). Same caveat: check
    # "roll N deg off level" at trajectory_generation.
    auto_collect_level_drill: true # Hold the drill upright about the wall normal
    auto_collect_drill_roll_deg: 0.0 # Cant off level about the drill axis, if upright is not the grip wanted [deg]
    # Re-read the target every tick so configuration-dependent FK error cancels
    # against the IK. Constant offsets (right_drill_link -> drill_tip_link) are not
    # corrected. False: track and log the correction without applying it.
    auto_collect_correct_target: true # Track the live target instead of replaying the plan
    # Slew limits (not gains), guarding against bad or lost mocap frames.
    auto_collect_correction_rate_mm_s: 5.0 # Max speed the correction may move the command [mm/s]
    # Beyond this it is wrong body / lost tracking; the correction saturates and logs.
    auto_collect_correction_max_mm: 30.0 # Max total position correction [mm]
    # Orientation correction keeps the wall normal (target x-axis) accurate.
    auto_collect_correction_rate_deg_s: 3.0 # Max speed the correction may turn the command [deg/s]
    auto_collect_correction_max_deg: 3.0 # Max total orientation correction [deg]
    # False without the recorder; bookkeeping and settle gate still run. Set true
    # with g1_teleoperation's recorder.launch.py.
    auto_collect_auto_record: false # Publish start/save/discard on /record_episode automatically
    auto_collect_hold_record_s: 3.0 # Seconds the tip must stay settled on target before saving
    # Settle gate (measured FK vs goal). Loose bring-up values that absorb
    # URDF/encoder/mocap calibration error; tighten toward 5.0 / 3.0.
    auto_collect_settle_pos_mm: 15.0 # Max tip position error to count as settled [mm]
    auto_collect_settle_ang_deg: 5.0 # Max tip orientation error to count as settled [deg]
    auto_collect_settle_timeout_s: 15.0 # Give up and discard if not settled this long into the hold
    # Off for bring-up; enable for training data (else every start is identical).
    auto_collect_randomize_start: false # Jitter the right arm on `going_to_default`
    auto_collect_start_pose_noise_deg: 10.0 # Uniform +/- jitter per right-arm joint [deg]
    # Camera gate: project the target into both cameras' prepared (squared,
    # rectified) frames before planning; skip and log if visible in neither.
    auto_collect_require_target_visible: true # Skip episodes whose target is off-camera
    # Metric, not pixels (cameras differ in range and fx); 0 = centre only.
    auto_collect_visibility_margin_m: 0.01 # Border clearance the target must keep [m]
    # MUST be false: the real wall publishes only `red_square_target`.
    auto_collect_randomize_task: false # Sample target colour + instruction per episode
    # MUST be false: loop mode needs the sim to answer /sim/reset_request.
    auto_collect_loop: false # Run save/discard -> reset -> retract -> plan -> approach forever
    auto_collect_loop_stall_timeout_s: 30.0 # Re-request a sim reset if the loop idles in HOLDING this long
